name: Paquet .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile src/ligne_emak/*.py tests/*.py
      - name: Fabriquer le paquet
        run: ./build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ligne-emak-deb
          path: build/*.deb
      - name: Notes de version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -f "docs/notes/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/notes/${GITHUB_REF_NAME}.md" notes.md
          else
            echo "Voir le README pour l'installation." > notes.md
          fi
      - name: Publier la version avec le .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ligne EMAK ${{ github.ref_name }}
          body_path: notes.md
          files: build/*.deb
