name: Paquet .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile src/ligne_emak/*.py tests/*.py
      - name: Fabriquer le paquet
        run: ./build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ligne-emak-deb
          path: build/*.deb
